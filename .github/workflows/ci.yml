name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Check formatting
        run: uv run ruff format . --check

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy src tests

  test:
    needs: quality
    name: Python ${{ matrix.python-version }} / Django ${{ matrix.django-version }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            django-version: "5.2"
          - python-version: "3.12"
            django-version: "5.2"
          - python-version: "3.12"
            django-version: "6.0"
          - python-version: "3.13"
            django-version: "5.2"
          - python-version: "3.13"
            django-version: "6.0"
          - python-version: "3.14"
            django-version: "5.2"
          - python-version: "3.14"
            django-version: "6.0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-suffix: python-${{ matrix.python-version }}-django-${{ matrix.django-version }}

      - name: Install dependencies
        run: |
          uv sync --dev --locked
          uv pip install "Django~=${{ matrix.django-version }}.0"

      - name: Show versions
        run: |
          uv run --no-sync python --version
          uv run --no-sync python -m django --version

      - name: Run tests
        run: >
          uv run --no-sync pytest
          --cov=django_identifiers
          --cov-branch
          --cov-report=term-missing
          --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.14' && matrix.django-version == '6.0'
        uses: codecov/codecov-action@v6
        with:
          files: coverage.xml
          fail_ci_if_error: true
          use_oidc: true

  package:
    needs:
      - quality
      - test
    name: Package validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-suffix: package

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Build distributions
        run: make build

      - name: Validate distributions
        run: make check-dist

      - name: Verify typed wheel
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          unzip -l "$wheel" | grep -q "django_identifiers/py.typed"

      - name: Install and import wheel
        run: make install-wheel
